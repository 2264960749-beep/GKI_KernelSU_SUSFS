name: Android 14 6.1 PLF110
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库本身文件
        uses: actions/checkout@v4
        fetch-depth: 1

      - name: 通过镜像克隆完整天玑PLF110内核源码
        run: |
          git clone https://mirror.ghproxy.com/https://github.com/OnePlusOSS/android_kernel_oneplus_mt6989.git kernel-source
          cd kernel-source

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip git

      - name: 内核配置编译
        run: |
          cd kernel-source
          export ARCH=arm64
          make oplus_plf110_defconfig
          make -j$(nproc)

      - name: 打包AnyKernel刷机包
        run: |
          cd kernel-source
          mkdir -p out
          cp arch/arm64/boot/Image out/
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/Image ak3/
          cd ak3
          zip -r ../../PLF110-GKI-Kernel.zip *

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: PLF110-GKI内核刷机包
          path: PLF110-GKI-Kernel.zip
