name: Android 14 6.1 PLF110
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取天玑PLF110原厂内核源码
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_mt6989
          ref: oneplus/mt6989_v_15.0.2_ace5_race
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip git

      - name: 内核配置编译
        run: |
          export ARCH=arm64
          make oplus_plf110_defconfig
          make -j$(nproc)

      - name: 打包AnyKernel刷机包
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/Image ak3/
          cd ak3
          zip -r ../PLF110-GKI-Kernel.zip *

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: PLF110-GKI内核刷机包
          path: PLF110-GKI-Kernel.zip

