name: Android 14 6.1 PLF110
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      # 拉取你当前仓库文件（SUSFS/KernelSU补丁）
      - name: 拉取本地仓库补丁
        uses: actions/checkout@v4
        fetch-depth: 1

      # ghproxy镜像加速克隆一加完整内核源码，规避github直连超时
      - name: 镜像下载PLF110完整内核
        run: |
          git clone --depth 1 https://mirror.ghproxy.com/https://github.com/OnePlusOSS/android_kernel_oneplus_mt6989.git kernel-src
          cd kernel-src

      # 安装全套编译依赖
      - name: 安装编译工具链
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip git

      # 编译PLF110 GKI内核，完整保留风驰游戏内核
      - name: 内核配置&编译
        run: |
          cd kernel-src
          export ARCH=arm64
          make oplus_plf110_defconfig
          make -j$(nproc)

      # 打包可刷入AnyKernel3刷机包
      - name: 打包刷机zip
        run: |
          cd kernel-src
          mkdir out
          cp arch/arm64/boot/Image out/
          git clone https://mirror.ghproxy.com/https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/Image ak3/
          cd ak3
          zip -r ../../PLF110-GKI-SUSFS.zip *

      # 上传成品刷机包
      - name: 导出刷机包
        uses: actions/upload-artifact@v4
        with:
          name: PLF110-GKI完整内核包
          path: PLF110-GKI-SUSFS.zip
