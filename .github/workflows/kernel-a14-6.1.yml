name: Android 14 6.1
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 自动把嵌套文件夹内所有内核文件移动到仓库根目录
      - name: 解压嵌套内核目录
        run: |
          mv android_kernel_oneplus_mt6989-oneplus-mt6989_v_15.0.2_ace5_race/* ./
          rm -rf android_kernel_oneplus_mt6989-oneplus-mt6989_v_15.0.2_ace5_race

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip lld llvm python3

      - name: 内核配置&编译
        run: |
          export ARCH=arm64
          make oplus_plf110_defconfig
          make -j$(nproc)

      - name: 打包刷机包
        run: |
          mkdir anykernel
          cp arch/arm64/boot/Image anykernel/
          cd anykernel
          zip -r ../kernel.zip Image
          cd ..

      - name: 发布刷机包到Releases
        uses: softprops/action-gh-release@v1
        with:
          files: kernel.zip
          tag_name: PLF110-A14-6.1-${{ github.sha }}
          generate_release_notes: true
