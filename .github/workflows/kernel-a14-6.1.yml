name: Android 14 6.1
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库（包含已上传的内核源码）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip lld llvm python3

      - name: 内核配置&编译
        run: |
          export ARCH=arm64
          make oplus_plf110_defconfig
          make -j$(nproc)

      - name: 打包刷机包
        run: |
          mkdir anykernel
          cp arch/arm64/boot/Image anykernel/
          cd anykernel
          zip -r ../kernel.zip Image
          cd ..

      - name: 发布
        if: true
        uses: softprops/action-gh-release@v1
        with:
          files: kernel.zip