name: Android 14 6.1
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip llvm

      - name: 基础内核配置
        run: |
          export ARCH=arm64
          make defconfig

      - name: 编译内核
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc)

      - name: 打包刷机包
        run: |
          mkdir anykernel
          cp arch/arm64/boot/Image anykernel/
          cd anykernel
          zip -r ../kernel.zip Image
          cd ..

      - name: 上传成品
        uses: softprops/action-gh-release@v1
        with:
          files: kernel.zip