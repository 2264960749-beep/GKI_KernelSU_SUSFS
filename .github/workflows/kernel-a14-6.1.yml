name: Android 14 6.1
permissions:
  contents: write
  actions: write
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      make_release:
        required: true
        type: boolean
        default: true
      kernelsu_variant:
        required: true
        type: string
        default: Next
      kernelsu_branch:
        required: true
        type: string
        default: Stable
      version:
        required: false
        type: string
        default: ""
      use_zram:
        description: '是否开启增加更多ZRAM算法?'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: '是否开启KPM功能?'
        required: true
        type: boolean
        default: true
jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取当前仓库（仅包含workflow与vendor_boot.img）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 拉取一加Ace5竞速 PLF110 官方内核源码（云端自动下载，不用手机上传大文件）
        run: |
          git clone -b oneplus/mt6989_v_15.0.2_ace5_race https://github.com/OnePlusOSS/android_kernel_oneplus_mt6989.git tmp_kernel
          mv tmp_kernel/* ./
          rm -rf tmp_kernel

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libelf-dev bison flex zip unzip lld llvm python3

      - name: 下载MT6989天玑9400e专用Clang工具链
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r498229b clang
          echo "CLANG_BIN=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV
          echo "PATH=$CLANG_BIN:$GITHUB_ENV" >> $GITHUB_ENV

      - name: 拉取AK3 / Sukisu / SUSFS补丁
        run: |
          git clone https://github.com/ShirkNeko/ak3-patch scripts/patch_ak3
          git clone https://github.com/SukisuKernel/Sukisu-Kernel-Patch scripts/patch_sukisu
          git clone https://gitlab.com/simonpunk/susfs4ksu susfs
          cd susfs && git checkout gki-android14-6.1

      - name: 应用全部内核补丁
        run: |
          bash scripts/patch_ak3/apply.sh $GITHUB_WORKSPACE
          bash scripts/patch_sukisu/apply_gki.sh $GITHUB_WORKSPACE
          cd susfs && bash apply_patches.sh $GITHUB_WORKSPACE

      - name: 加载PLF110设备配置并开启功能开关
        run: |
          export ARCH=arm64
          make oplus_plf110_defconfig
          # 完整GKI镜像编译
          scripts/config --enable BUILD_GKI_BOOTIMG
          # AK3调度
          scripts/config --enable CONFIG_AK3_SCHEDULER
          # Sukisu基础
          scripts/config --enable CONFIG_SUKISU
          scripts/config --enable CONFIG_MODULES
          # SUSFS全套隐藏功能
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --enable CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          # 导出Oplus游戏驱动符号，兼容风驰内核模块
          scripts/config --enable CONFIG_OPLUS_GAME_MODULE_EXPORT
          # 禁用小米平板专属配置
          scripts/config --disable CONFIG_HMBIRD
          # ZRAM、KPM开关
          if [[ "${{ inputs.use_zram }}" == "false" ]]; then
            scripts/config --disable CONFIG_ZRAM
          fi
          if [[ "${inputs.use_kpm}" == "false" ]]; then
            scripts/config --disable CONFIG_KPM
          fi

      - name: 编译完整GKI内核镜像
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc)

      - name: 打包AnyKernel3刷机包（嵌入你上传的vendor_boot.img）
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cp arch/arm64/boot/Image anykernel/Image
          cp ./vendor_boot.img anykernel/vendor_boot.img
          cd anykernel
          zip -r ../GKI-AK3-SUKISU-PLF110.zip *
          cd ..

      - name: 发布成品到Release
        if: ${{ inputs.make_release == true }}
        uses: softprops/action-gh-release@v1
        with:
          files: GKI-AK3-SUKISU-PLF110.zip
          tag_name: PLF110-A14-6.1-${{ github.sha }}
          generate_release_notes: true
